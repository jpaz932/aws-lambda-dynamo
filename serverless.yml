service: aws-node-express-dynamodb-api-project
frameworkVersion: '3'

custom:
  tableName: HeroesTable

provider:
  name: aws
  runtime: nodejs14.x
  region: us-west-2
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [ HeroesTable, Arn ]
  environment:
    HEROES_TABLE: ${self:custom.tableName}

functions:
  app:
    handler: handler.handler
    events:
      - http: 'GET /getHeroes'
      - http: 'POST /crateHero'
      - http: 'GET /getHero/{id}'
      - http: 'PUT /updateHero/{id}'
      - http: 'DELETE /deleteHero/{id}'
      - http: 'GET /heroesExcel'
      - http: 'GET /heroesPdf'

resources:
  Resources:
    HeroesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
